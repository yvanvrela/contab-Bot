version: '3.8'

services:
  selenium:
    image: selenium/standalone-firefox:latest
    container_name: contabbot_selenium
    shm_size: '2g'
    ports:
      - "4444:4444"
      - "7900:7900" # Puerto para VNC (permite ver el navegador en vivo en http://localhost:7900)
    restart: unless-stopped

  bot:
    build: .
    container_name: contabbot_app
    depends_on:
      - selenium
    env_file:
      - .env
    environment:
      - SELENIUM_URL=http://selenium:4444/wd/hub
      # Sobrescribimos las rutas locales si es necesario
      # Estas variables prevalecen sobre las que existan en el .env
    volumes:
      # Montaje de la base de datos persistente
      - ./src/db/config:/app/src/db/config
      
      # Mapeos de discos compartidos de red (Ajustar según la ruta física en el Host)
      # Nota: En Windows, Z:/ debe mapearse desde la ruta local o compartida de WSL/Hyper-V
      # - /Z/r90:/app/archives/r90
      # - /Z/anulados:/app/archives/anulados
    restart: unless-stopped

